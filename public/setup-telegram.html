<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>اتصال ربات Qubo</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:520px;margin:48px auto;padding:0 18px;line-height:1.8}
    input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;font:inherit}
    button{cursor:pointer}
    #result{white-space:pre-wrap}
  </style>
</head>
<body>
  <h2>اتصال ربات Qubo به تلگرام</h2>
  <p>مقدار <b>WEBHOOK_SECRET</b> را که در Cloudflare ذخیره کرده‌ای وارد کن. این مقدار فقط به سایت خودت ارسال می‌شود؛ آن را در چت برای کسی نفرست.</p>
  <form id="form">
    <input id="secret" type="password" autocomplete="off" required placeholder="WEBHOOK_SECRET">
    <button type="submit">اتصال ربات</button>
  </form>
  <p id="result" role="status"></p>
  <script>
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = document.getElementById("result");
      const button = event.currentTarget.querySelector("button");
      button.disabled = true;
      result.textContent = "در حال اتصال...";
      try {
        const response = await fetch("/api/setup-telegram", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ setupSecret: document.getElementById("secret").value })
        });
        const data = await response.json();
        result.textContent = data.ok ? "✅ ربات با موفقیت به تلگرام وصل شد." : "❌ " + (data.error || "خطا در اتصال");
        if (data.ok) document.getElementById("secret").value = "";
      } catch {
        result.textContent = "❌ ارتباط برقرار نشد. دوباره تلاش کن.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
