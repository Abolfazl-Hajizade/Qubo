name: Qubo physics regression

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/qubo/engine.ts'
      - 'src/qubo/main.ts'
      - 'tests/qubo-physics.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
