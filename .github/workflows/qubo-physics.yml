name: Qubo physics and browser regression

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/qubo/engine.ts'
      - 'src/qubo/main.ts'
      - 'tests/qubo-physics.test.ts'
      - 'tests/qubo-browser.spec.ts'
      - '.github/workflows/qubo-physics.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-and-browser-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser engines
        run: npx playwright-core install --with-deps chromium firefox webkit
      - name: Start local Vite server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/qubo-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/qubo/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qubo-vite.log
          exit 1
      - name: Run browser smoke tests
        run: node --test tests/qubo-browser.spec.ts
        env:
          QUBO_TEST_URL: http://127.0.0.1:4173
